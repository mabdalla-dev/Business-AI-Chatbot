<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sample Grill | Staff Login Demo</title>
</head>
<body>
    <h1>The Sample Grill — Staff Login (Demo)</h1>


    {% if error %}
    <p>{{ error }}</p>
    {% endif %}
<form method="POST" action="/staff/login">
    <label for="username">Username:</label>
    <input
        type="text"
        id="username"
        name="username"
        required
    >

    <br><br>

    <label for="password">Password:</label>
    <input
        type="password"
        id="password"
        name="password"
        required
    >

    <br><br>

    <button type="submit">Log In</button>
</form>

</body>
</html>
